name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS Simulator · resolve + build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Proves the remote package genuinely resolves from GitHub at the pinned
      # version. This is the step that would fail if the tag were wrong, the
      # repo private, or the dependency a stale local path.
      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project Demo.xcodeproj -scheme Demo

      - name: Show resolved version
        run: |
          F=Demo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if [ -f "$F" ]; then cat "$F"; else echo "Resolved fresh from the version requirement (no Package.resolved committed)."; fi

      # Find an Xcode that can actually produce an iOS Simulator destination.
      #
      # This is a fix for a real, reproduced failure, and the first attempt at
      # fixing it was wrong in an instructive way. Hardcoding
      # `/Applications/Xcode_16.app` produced:
      #
      #     xcodebuild: error: Unable to find a destination matching the
      #     provided destination specifier: { generic:1, platform:iOS Simulator }
      #     Ineligible destinations: { platform:iOS, ...,
      #       error:iOS 18.0 is not installed. }
      #
      # The obvious fix — probe `xcodebuild -showsdks` for `iphonesimulator` —
      # did NOT work, because under Xcode 16's split platform model the *SDK*
      # ships with Xcode while the *platform* is a separate download. The SDK
      # was present; the platform was not; the probe passed and the build failed
      # identically.
      #
      # So probe the thing that actually matters: whether `-showdestinations`
      # lists an iOS Simulator destination for this scheme. If no installed
      # Xcode offers one, download the platform rather than failing.
      - name: Ensure an iOS Simulator destination exists
        run: |
          set -uo pipefail
          pick() {
            for app in /Applications/Xcode_16*.app /Applications/Xcode.app /Applications/Xcode_*.app; do
              [ -d "$app" ] || continue
              if DEVELOPER_DIR="$app/Contents/Developer" xcodebuild \
                   -project Demo.xcodeproj -scheme Demo -showdestinations 2>/dev/null \
                   | grep -q 'platform:iOS Simulator'; then
                sudo xcode-select -s "$app"
                echo "Selected $app"
                return 0
              fi
            done
            return 1
          }
          if pick; then xcodebuild -version; exit 0; fi
          echo "No installed Xcode offers an iOS Simulator destination; downloading the iOS platform."
          sudo xcodebuild -downloadPlatform iOS || true
          if pick; then xcodebuild -version; exit 0; fi
          echo "::error::Could not obtain an iOS Simulator destination on this runner."
          xcodebuild -project Demo.xcodeproj -scheme Demo -showdestinations || true
          exit 1

      # `generic/platform=iOS Simulator` on purpose — never a named device.
      # Pinning to `name=iPhone 16,OS=latest` would additionally tie the job to
      # whichever simulator *runtimes* are installed on that day's runner image.
      # A compile-only check needs no device to exist — but, as the step above
      # documents, it does still need the iOS platform.
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Demo.xcodeproj \
            -scheme Demo \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
